name: 6-Context
env:
    my_env: "Workflow"
on: 
     push:
     workflow_dispatch:  

jobs:
    echo:
        runs-on: ubuntu-latest
        env:
            my_env: "Job"
        steps:
            - name: Echo Context
              run: |
               echo "The context of this workflow is ${{ github.workflow }}"
               echo "The event that triggered it is ${{ github.event_name }}"
               echo "The branch that triggered it is ${{ github.ref }}"
               echo "The commit message that triggered it is ${{ github.event.head_commit.message }}"
               echo "The actor that triggered it is ${{ github.actor }}"
               echo "The repository that triggered it is ${{ github.repository }}"
               echo "The workflow run ID is ${{ github.run_id }}"
               echo "The workflow run number is ${{ github.run_number }}"
               echo "The workflow job is ${{ github.job }}"
            - name: Retrive variables
              run: |
               echo " variable value : ${{var.my_var}}"
            - name: Print Environment Variable 
              run: |
               echo "Environment variable at job level: $my_env"               
            - name : Print Environment Variable at the step level 
              env:
                my_env: "Step"
              run: |
                   echo "Environment variable at step level: $my_env"
name: 4 Using actions

on: 
     # push:
     workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v3
              with: 
                node-version: '20.x'

            - name: Install Dependencies
              run: npm ci
              working-directory: 4-Using-Actions/react-app

            - name: Run unit tests
              run: npm run test
              working-directory: 4-Using-Actions/react-app
